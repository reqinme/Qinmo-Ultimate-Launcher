name: verify

# U0 的最小 CI：**只做一件事——证明这两个测试套件在任何机器上都能跑**。
#
# 有意不做的事：
#   - 不构建 Tauri 应用（U0 还没有 src-tauri；等 M4 再加）
#   - 不缓存 Rust（minimal profile 下构建只有几秒，缓存的复杂度不值得）
#   - 不做安全扫描 / 许可证扫描（等引入真实依赖后再做，见方案 §11.5）
#
# **注意**：`repos/` 与 `_archive/` 已被 .gitignore 排除，CI 里不存在，
# 所以下方按方案 §8.2 做的"内核不许出现游戏词汇"快速扫描**不会误报**。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust · 内核测试与架构约束
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（把警告当错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试（含架构约束测试）
        run: cargo test --workspace --all-targets

  # 护栏"能红"检查（M0 · S4）。
  #
  # 为什么它必须进 CI：**一个永远绿的检查，和没有检查是一样的** ——
  # 而且更坏，因为它给人"已经守住了"的错觉。
  # 本作业故意造出违规、要求对应护栏**报红**，然后清理干净并**要求重新变绿**。
  #
  # **单独一个作业，而不是塞进 guard**：它同时需要 Rust（跑架构测试）
  # 与 pnpm（跑 lint），而 `guard` 作业两个都没装。
  # 塞进去的后果是它会在 CI 里因为"环境缺失"失败 ——
  # 那和"护栏失灵"长得一模一样，等于把一条纪律变成噪声。
  canary:
    name: 纪律 · 护栏必须能被踩红
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 三条护栏都必须能被踩红，且清理后重新变绿
        shell: pwsh
        run: ./tools/s4-guardrail-canary.ps1

      # 流程 B（M0）：来源记录 + 依赖许可 + 防误粘贴。
      #
      # 防误粘贴检查只在存在 repos/ 时才有意义。CI 里 repos/ 被 .gitignore
      # 排除（它们是只读参考、且体积大），所以这一步在 CI 上会以"无法运行"
      # 退出并报错 —— 那是**刻意的**：一个跑不起来的检查绝不能被当成通过。
      # 因此这里用 continue-on-error 之前的显式判断，而不是静默跳过。
      - name: 参考仓库是否就位
        id: repos
        shell: pwsh
        run: |
          if (Test-Path repos) {
            Write-Output "present=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "present=false" >> $env:GITHUB_OUTPUT
            Write-Output "repos/ absent in CI (gitignored reference clones) - the paste guard and the canary cannot run here."
          }

      - name: 依赖许可与来源记录
        if: steps.repos.outputs.present == 'true'
        shell: pwsh
        run: ./tools/check-licenses.ps1

      - name: 防误粘贴检查
        if: steps.repos.outputs.present == 'true'
        shell: pwsh
        run: ./tools/check-copy-paste.ps1

      - name: 防误粘贴检查必须能被踩红
        if: steps.repos.outputs.present == 'true'
        shell: pwsh
        run: ./tools/paste-guard-canary.ps1

  web:
    name: 前端 · 类型 / lint / 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: lint（含"界面禁止字面颜色值 / 禁止按产品名分支"三条纪律规则）
        run: pnpm lint

      - name: 测试
        run: pnpm test

      # 构建也进 CI。理由：U0 期间 build 一直没被验证过——
      # typecheck/lint/test 全绿并不能推出"能构建"（构建还涉及 Vite 的
      # 依赖解析、资源路径、target 兼容性）。**没被验证过的步骤等于没有。**
      - name: 构建
        run: pnpm build

  # 方案 §8.2 的"内核不许出现游戏词汇"——CI 侧。
  #
  # 这条规则现在有**三层**，而三层各自防的东西不同、都必须留着：
  #
  #   1. `crates/qul-core/tests/architecture.rs`（Rust 测试）
  #      —— 跑在 `cargo test` 里，所以**任何机器**上都会跑。
  #      它管：品牌词、数据目录名、依赖方向、能力表完整性、文件名纪律。
  #      它的判据是"去注释 + 去 cfg(test) + 小写 + 子串包含"。
  #
  #   2. `tools/scan-core-vocabulary.ps1`（本作业）
  #      —— 更细的一层：它做**标识符边界**判定（`forget` 不算 `forge`、
  #      而 `MojangApproval` 算 `mojang`），并且**能认出硬编码主机名**
  #      （按配置规格，"任何产品端点都不许是内核里的编译期常量"）。
  #      子串判定做不到第二件事。
  #
  #   3. `tools/_probe-scan.ps1`（反证）
  #      —— **一个从不报警的检查器与一个正常工作的检查器无法区分。**
  #      它往真实内核文件里注入已知违规、断言被抓到，再注入已知非违规、
  #      断言保持沉默，然后还原并要求工作区重新变干净。
  #
  # 三层都在这里跑，不是冗余：第 1 层在第 2、3 层被误删时仍然拦得住，
  # 而第 2 层在第 1 层的子串判据太粗时仍能分辨。
  guard:
    name: 纪律 · 内核无游戏词汇 + 工作区清洁
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 内核源码不许出现游戏专属词汇（廉价版，作为第 1 层的旁证）
        shell: bash
        run: |
          set -euo pipefail
          if grep -rniE 'minecraft|mojang|forge|fabric|neoforge|quilt|bedrock|optifine' \
               crates/qul-core/src \
               --include='*.rs' \
               | grep -vE '^\s*[^:]+:[0-9]+:\s*(//|/\*|\*)'; then
            echo "::error::内核源码里出现了游戏专属词汇（内核不认识具体游戏，见方案 §3.3 / §1.4）"
            exit 1
          fi
          echo "内核源码干净。"

      - name: 内核词汇扫描（标识符边界 + 硬编码主机）
        shell: pwsh
        run: ./tools/scan-core-vocabulary.ps1

      - name: 词汇扫描的反证（检查器必须能被踩红，且还原后重新变干净）
        shell: pwsh
        run: ./tools/_probe-scan.ps1

      - name: 工作区必须干净（防止生成物被误提交）
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"

      # 文档结构检查。这不是"文档洁癖"，而是**补上一类自动校验抓不到的故障**：
      # `edit` 的替换语义会**吃掉标题**（用标题当锚点、忘了抄回 new_string），
      # 而文档仍然是合法 Markdown —— 旧的"重复标题 = 0 / 围栏成对"两项**测不到它**
      # （消失的标题不是重复，围栏也不受影响）。本项目已发生 4 次。
      # 因此加了"标题守恒"：每个文件的标题总数必须等于基线；
      # 改基线必须是一次显式的、能在 diff 里被看见的动作（-UpdateBaseline 并一起提交）。
      - name: 文档结构检查（标题守恒 / 重复标题 / 围栏成对）
        shell: pwsh
        run: ./tools/check-docs.ps1 -Strict

      # 里程碑审计（流程 C）。纯文本分析，不需要 Rust / pnpm，所以放这里而不是
      # canary 作业。它的检查 1、2 需要语义判断，脚本只能给候选清单 ——
      # 因此只有 P0（会误导实现或许可风险）才让它失败：一个永远红的审计
      # 会被人略读，而那比没有审计更糟。
      - name: 里程碑审计（引用 / 承诺 / 许可 / 计数）
        shell: pwsh
        run: ./tools/audit-milestone.ps1 -OutDir docs/_artifacts/audit
