[package]
name = "qul-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
# ⚠️ **它有自己的 `[workspace]` 表** —— 见仓库根的 `Cargo.toml` 里的 `exclude`。
#
# 那一行不是"绕过"：它买到两件真实的东西 ——
#   1. **产品的依赖面是一份可审计的短清单**（`Cargo.lock` 仍 18 个包）
#   2. **内核的测试不需要先编 210 个 crate**（`cargo test -p qul-core` 仍是秒级）
#
# 而代价是"`src-tauri` 的依赖要单独看" —— 命令写在 `docs/来源记录.md` 里。
[workspace]

[dependencies]
tauri = { version = "2.12", features = [] }
# 🔴 **命令层要 import 内核的公共模型**（方案 §3.5："Tauri 命令层（薄壳）"）。
#
# 这是"薄壳"这个词的**机制**，而不是一句自我评价：
# 下面 `capabilities` 那条命令返回的类型**就是** `qul_core::island::IslandState`、
# 而"该有哪些能力"由内核的 Provider 决定 —— 命令层**不自己编一份清单**。
#
# ⚠️ 路径依赖而不是版本依赖：它是**同一个仓库里的**东西，
# 而"发布到 crates.io 再引用"会让"改了内核却忘了更新版本"变成一个
# **能编译而行为是旧的**的 bug。
qul-core = { path = "../crates/qul-core" }
# 🔴 **命令层调编排层，而不是自己编排。**
#
# 那件事在 M4 期间被两次"撞墙"逼出来（见 `docs/灵动岛接线-边界分析.md`）：
# 第一次我试图在命令层直接调 `qul_infra::install::install` —— 而它要
# `Descriptor` / `Env` / `Transport` 三样**决策**，于是我在命令层里
# 复制了一份"先缓存再联网"的策略。
#
# 现在那些策略在 `qul-app` 里，而这一层只做**翻译**：
# 调 `install_to_instance`，把 `StageSink` 的消息翻成 `IslandState`。
#
# 而 `qul-infra` 仍然直接依赖，因为**transport 的选择是调用方的**
#（`WinHttpTransport` / `NoNetwork`）—— 那正是 CLI 那边也保留的三处。
qul-app = { path = "../crates/qul-app" }
qul-infra = { path = "../crates/qul-infra" }
# ⚠️ **它是我们确实要的**，而不是顺手加的：方案 §3.4 的材质降级链
# （Mica → Acrylic → Tabbed → 纯色）要靠它。
window-vibrancy = "0.8"
# 与产品同版本（仓库根 `[workspace.dependencies]` 里那两个）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ⚠️ **刻意没有 `tauri-plugin-fs` / `-shell` / `-http` / `-process`。**
#
# 方案 §5.8 第 2 条原文："**默认不授予 `fs` / `shell` / `http` 的宽泛能力**；
# 需要文件操作的功能走**自定义命令**而不是通用 fs 插件"。
#
# 这不是"还没加"，而是**永久不加** —— 需要读写文件的每个功能都在下面
# 写一条自定义命令，而那条路径上有 `qul-infra` 的 `ensure_within`
# 与原子写（ADR-0013），通用 fs 插件没有那些约束。
#
# 由 `tools/check-tauri-baseline.ps1` 强制。

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
# 与仓库根的发布配置**一致**（方案 §7 的预算：安装包 ≤25 MB 不含运行时）
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
