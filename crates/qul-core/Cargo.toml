[package]
name = "qul-core"
version = "0.0.0"
edition = "2021"
# MSRV 由工作区统一声明：`std::fs::File::lock` 需要 1.89（原子写与文件锁用到）。
rust-version.workspace = true
description = "内核：通用模型 + 规则（零 IO、零 Tauri、零 MC 词汇）"
publish = false

[dependencies]
serde = { workspace = true }
# `serde_json` 由 dev-dependency 提升为**正式依赖**（M1 崩溃标记要序列化成单行）。
# 提升的理由：标记的读写是**运行时**行为，不是测试行为。
serde_json = { workspace = true }
thiserror = { workspace = true }

