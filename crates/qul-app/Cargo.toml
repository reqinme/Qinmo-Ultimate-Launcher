[package]
name = "qul-app"
version = "0.0.0"
edition = "2021"
# MSRV 由工作区统一声明：`std::fs::File::lock` 需要 1.89（原子写与文件锁用到）。
rust-version.workspace = true
description = '编排层：把内核的判断组装成「界面与 CLI 都能调」的一件事'
publish = false

[dependencies]
# ⚠️ **只依赖内核**。这一条是结构性的：编排层不许直接碰 IO、网络、界面框架，
# 也不许直接调 provider——那些都在 `qul-infra` / `qul-provider-*` 里，
# 由本层在需要时调用（M1 起）。
qul-core = { path = "../qul-core" }
serde = { workspace = true }
