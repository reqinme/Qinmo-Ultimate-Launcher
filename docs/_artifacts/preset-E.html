<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>秦墨 · 主页预设 E（信息流）</title>
<style>
/* ==========================================================================
   预设 E · 信息流 —— 浅色主题（跟随系统）

   材质说明同 preset-C.html：底是"你的真实壁纸 + 模拟 Mica"，
   其余（层次、令牌、描边、排版）都是真的。本图判断布局与信息架构。
   ========================================================================== */
:root{
  --gray-9:#1a1a1c; --gray-7:#4a4a4f; --gray-5:#8e8e93; --gray-3:#d1d1d6; --gray-0:#f5f5f7;
  --accent-5:#0a66c2; --success-5:#1a7f37; --warning-5:#9a6700; --danger-5:#cf222e;

  --surface-panel:rgb(0 0 0 / 5%);
  --surface-card:rgb(255 255 255 / 62%);
  --surface-raised:#ffffff;
  --surface-active:rgb(0 0 0 / 8%);
  --surface-selected:rgb(0 0 0 / 8%);
  --stroke-subtle:rgb(0 0 0 / 12%);
  --stroke-strong:rgb(0 0 0 / 24%);
  --divider:rgb(0 0 0 / 8%);

  --text-primary:#1a1a1c; --text-secondary:#4a4a4f; --text-disabled:#8e8e93;
  --accent:var(--accent-5); --text-on-accent:#ffffff;

  --radius-md:8px; --radius-lg:12px;
  --hairline:1px;
  --elev-2:0 10px 28px rgb(0 0 0 / 18%);
  --font-ui:"Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --edge-grad:linear-gradient(135deg, rgb(255 255 255 / 85%), rgb(255 255 255 / 35%));
}
*{box-sizing:border-box}
html,body{margin:0}
body{ font:14px/1.6 var(--font-ui); color:var(--text-primary); background:#c9c7c4; padding:30px; }

.mica{ position:fixed; inset:0; z-index:-2; background-image:url('wallpaper.jpg');
  background-size:cover; background-position:center;
  filter:blur(50px) saturate(.5) brightness(1.5); transform:scale(1.15); }
.mica-tint{ position:fixed; inset:0; z-index:-1;
  background:linear-gradient(180deg, rgb(240 238 235 / 82%), rgb(233 230 227 / 86%)); }

.win{ width:1240px; height:788px; border-radius:10px; overflow:hidden;
  border:var(--hairline) solid var(--stroke-subtle);
  display:grid; grid-template-rows:36px 1fr 26px; }

.tb{ display:flex; align-items:center; gap:12px; padding-left:12px; }
.brand{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; white-space:nowrap; }
.brand .mk{ width:18px;height:18px;border-radius:5px;background:linear-gradient(140deg,#0a66c2,#6d4aff);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff; }
.search{ display:flex;align-items:center;gap:8px;height:26px;width:180px;padding:0 12px;
  border:var(--hairline) solid var(--stroke-subtle);border-radius:8px;background:var(--surface-card);
  color:var(--text-disabled);font-size:13px;white-space:nowrap; }
.search kbd{ margin-left:auto;font:12px/1 var(--font-mono);border:var(--hairline) solid var(--stroke-subtle);
  border-radius:3px;padding:2px 4px;color:var(--text-secondary); }
.island-slot{ flex:1; display:flex; justify-content:center; }
.island{ display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;
  border:var(--hairline) solid var(--stroke-strong);border-radius:999px;
  background:var(--surface-raised);box-shadow:var(--elev-2);white-space:nowrap; }
.island .dot{ width:7px;height:7px;border-radius:50%;background:var(--success-5); }
.island .sep{ width:var(--hairline);height:14px;background:var(--stroke-subtle); }
.island .who{ font-size:13px;color:var(--text-secondary); }
.wc{ display:flex; }
.wc div{ width:46px;height:36px;display:grid;place-items:center;color:var(--text-secondary);font-size:11px; }

/* 左导航：多了「实例」这一页——因为主页被信息流占了 */
.main{ display:grid; grid-template-columns:200px 1fr; min-height:0; }
.nav{ padding:10px; display:flex; flex-direction:column; gap:2px;
  border-right:var(--hairline) solid var(--divider); }
.nav a{ display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:8px;
  color:var(--text-secondary);text-decoration:none;font-size:15px;position:relative; }
.nav a.on{ background:var(--surface-selected); color:var(--text-primary); }
.nav a.on::before{ content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent); }
.nav a .i{ width:17px;text-align:center; }
.nav .push{ margin-top:auto; }

.content{ padding:20px 26px; overflow:hidden; }

.card{ border:var(--hairline) solid transparent; border-radius:var(--radius-lg);
  background: linear-gradient(var(--surface-card), var(--surface-card)) padding-box, var(--edge-grad) border-box; }
.panel{ border:var(--hairline) solid transparent; border-radius:var(--radius-lg);
  background: linear-gradient(var(--surface-card), var(--surface-card)) padding-box, var(--edge-grad) border-box; }
.chip{ font-size:12px;padding:2px 8px;border-radius:999px;border:var(--hairline) solid var(--stroke-subtle);
  background:rgb(255 255 255 / 60%);color:var(--text-secondary);white-space:nowrap; }
.btn{ height:36px;padding:0 20px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;
  font-size:15px;font-weight:600;border:var(--hairline) solid transparent; }
.btn--primary{ background:var(--accent);color:var(--text-on-accent); }
.btn--ghost{ background:rgb(255 255 255 / 55%);color:var(--text-primary);border-color:var(--stroke-subtle);font-weight:500; }
.statusbar{ display:flex;align-items:center;gap:12px;padding:0 16px;border-top:var(--hairline) solid var(--divider);
  color:var(--text-secondary);font-size:12px;font-family:var(--font-mono); }
.statusbar .grow{flex:1}
.statusbar .pill{border:var(--hairline) solid var(--stroke-subtle);border-radius:999px;padding:1px 8px}
</style>
</head>
<body>

<div class="mica"></div><div class="mica-tint"></div>

<div class="win">
  <div class="tb">
    <div class="brand"><span class="mk">秦</span>秦墨</div>
    <div class="search">⌕ 搜索<span>…</span><kbd>Ctrl K</kbd></div>
    <div class="island-slot">
      <div class="island"><span class="dot"></span><span class="who">官方源</span><span class="sep"></span><span class="who">reqinme</span></div>
    </div>
    <div class="wc"><div>─</div><div>▢</div><div>✕</div></div>
  </div>

  <div class="main">
    <nav class="nav">
      <a class="on"><span class="i">⌂</span>主页</a>
      <a><span class="i">▤</span>实例</a>
      <a><span class="i">↓</span>下载</a>
      <a><span class="i">▦</span>百宝箱</a>
      <a><span class="i">◉</span>账户</a>
      <a class="push"><span class="i">⚒</span>设置</a>
    </nav>

    <div class="content">
      <!-- 顶部：一条横向启动条 -->
      <div class="panel" style="display:flex;align-items:center;gap:16px;padding:14px 18px">
        <div style="width:42px;height:42px;border-radius:10px;background:linear-gradient(150deg,#0a66c2,#6d4aff);
                    display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff">1</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:600">1.20.1 · Fabric</div>
          <div style="font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)">上次启动 2 小时前 · 38 个模组</div>
        </div>
        <button class="btn btn--primary">▶&nbsp; 启动</button>
      </div>

      <!-- 竖排信息流 -->
      <div style="margin-top:14px;display:grid;gap:10px">

        <div class="card" style="padding:14px 16px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="chip" style="border-color:rgb(10 102 194 / 40%);color:#0a66c2;background:rgb(10 102 194 / 10%);font-weight:600">更新</span>
            <span style="font-size:12px;color:var(--text-disabled)">2 小时前</span>
          </div>
          <div style="font-size:15px;font-weight:600;margin-top:8px">1.21.4 已发布</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:3px">新增 3 种生物群系；Fabric 加载器已跟进。</div>
          <div style="margin-top:10px;display:flex;gap:8px">
            <button class="btn btn--primary" style="height:30px;font-size:13px;padding:0 14px">创建实例</button>
            <button class="btn btn--ghost" style="height:30px;font-size:13px;padding:0 12px">详情</button>
          </div>
        </div>

        <div class="card" style="padding:14px 16px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="chip">启动器</span><span style="font-size:12px;color:var(--text-disabled)">今天</span>
          </div>
          <div style="font-size:15px;font-weight:600;margin-top:8px">v0.2.0 可用</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:3px">下载引擎改用多段并行；修正一处续传校验。</div>
          <div style="margin-top:10px;color:var(--accent);font-size:13px;font-weight:600">重启并更新 →</div>
        </div>

        <div class="card" style="padding:14px 16px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="chip">你的动态</span><span style="font-size:12px;color:var(--text-disabled)">本周</span>
          </div>
          <div style="font-size:15px;font-weight:600;margin-top:8px">累计游玩 14 小时 22 分</div>
          <div style="height:6px;border-radius:3px;background:var(--surface-active);overflow:hidden;margin-top:10px">
            <i style="display:block;height:100%;width:62%;background:var(--accent)"></i>
          </div>
          <div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">1.20.1 Fabric 占 62%</div>
        </div>

      </div>
    </div>
  </div>

  <div class="statusbar">
    <span>v0.1.0</span><span class="pill">MC Java</span><span>官方源</span><span>↓ 12.4 MB/s</span>
    <span class="grow"></span><span>Java 21 · 内存 118 MB</span>
  </div>
</div>

</body>
</html>
