[workspace]
resolver = "2"
members = ["crates/qul-core", "crates/qul-infra", "crates/qul-app", "crates/qul-cli", "crates/qul-provider-mock"]
# `spikes/` 是一次性实验代码，**不属于产品**：
#   - 它的结论会写进文档，代码本身完成使命后即可丢弃
#   - 若留在 workspace 里，每次 `cargo test` 都会连带构建它（CI 变慢、且引入它自己的依赖）
# 排除之后它仍是**合法可构建**的独立包（`cargo build --manifest-path spikes/.../Cargo.toml`）。
  #
  # `src-tauri/` 同理，而它的理由**不同**：它要给产品加约 210 个 crate（实测见
  # `spikes/m1-tauri-tree/结论.md`）。排除之后：
  #   - 产品的 `Cargo.lock` 仍是 **18 个包**（一份可审计的短清单）
  #   - `cargo test -p qul-core` 不需要先编那 210 个（秒级 vs 分钟级）
  # 而 `src-tauri/Cargo.toml` 自己有一份 `[workspace]` 表，于是它自洽。
exclude = ["spikes", "src-tauri"]

# ── 工作区统一的包元数据 ──────────────────────────────────────
[workspace.package]
# **1.89 是硬下限，不是随手填的数字。**
#
# `std::fs::File::lock` / `try_lock`（原子写与文件锁的底座，见 ADR-0013）
# 正是在 1.89 稳定。声明一个更低的 MSRV 不会让代码在新工具链上跑得更广，
# 只会让"1.77 也能编"这句话变成**假的**——而这个谎在 CI 换工具链时才会暴露。
#
# 这一条是 `cargo clippy` 抓出来的：`-D warnings` 下 MSRV 不匹配是 error。
# 也就是说**测试全绿的同时，声明可以是错的**——能被工具检查的声明，就该让工具去检查。
rust-version = "1.89"

# ── 工作区统一依赖版本（成员 crate 用 `dep.workspace = true` 引用）──
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ── 发布配置 ──────────────────────────────────────────────────
[profile.release]
# 体积优先（方案 §7 的预算里，安装包 ≤25 MB 不含运行时）
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
